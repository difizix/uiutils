[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uiutils"
version = "0.1.0"
description = "Small GUI helpers: Makefile targets, argparse forms, and Streamlit pages built on them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
streamlit = ["streamlit>=1.30"]

[dependency-groups]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/difizix/uiutils"

[tool.hatch.build.targets.wheel]
packages = ["src/uiutils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
